; FOMO centroid detection on XIAO ESP32S3 Sense (PSRAM required).
[platformio]
default_envs = seeed_xiao_esp32s3

[env]
platform = espressif32@6.12.0
board = seeed_xiao_esp32s3
framework = arduino
; Keep the Arduino 2.0.14 API used by the bundled TFLite Micro/ESP-NN library.
platform_packages = platformio/framework-arduinoespressif32@3.20014.231204
monitor_speed = 115200
build_flags =
    -DESP_NN
    -DCONFIG_NN_OPTIMIZED=1
    -DCONFIG_NN_OPTIMIZATIONS=1
    -DCONFIG_IDF_TARGET_ESP32S3=1
    -O3

[env:seeed_xiao_esp32s3]

[env:seeed_xiao_esp32s3_static]
build_flags =
    ${env.build_flags}
    -DFOMO_STATIC_IMAGE=1
